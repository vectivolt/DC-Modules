<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 618 1230" width="618" height="1230" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
  .board{fill:#fbfbf9;stroke:#333;stroke-width:2}
  .btitle{font-size:15px;font-weight:700;fill:#1a1a1a}
  .bsub{font-size:11px;fill:#666}
  .zl{font-size:11.5px;font-weight:700;fill:#1a1a1a;text-anchor:middle}
  .zd{font-size:9.5px;fill:#555;text-anchor:middle}
  .rail{fill:#2f7d5e;opacity:.8}
  .railbad{fill:#a03030;opacity:.85}
  .track{fill:#ddd}
  .limit{stroke:#a03030;stroke-width:2}
  .rlbad{font-size:9px;fill:#a03030;font-weight:700}
  .rl{font-size:9px;fill:#a03030}
  .barrier{stroke:#7a3b8a;stroke-width:4;stroke-dasharray:9 4}
  .bar{font-size:9.5px;fill:#7a3b8a;text-anchor:middle}
  .face{font-size:11px;font-weight:700;fill:#1a1a1a}   /* no text-anchor: set per element */
  .fd{font-size:9.5px;fill:#555}                       /* no text-anchor: set per element */
  .flow{font-size:10.5px;font-weight:600}
  .cap{font-size:10px;fill:#666}
  text{dominant-baseline:middle}
</style>
<rect width="618" height="1230" fill="#fff"/>
<text x="62" y="30" style="font-size:17px;font-weight:700">PCB floorplan — zone plan, 60 kW (drawn to board scale)</text>
<text x="62" y="50" class="cap">Power flows rear → front on both boards. Air flows front → rear. Zones from docs/pcb-floorplan.md §3–§4.</text>

<text x="62" y="98" class="face" text-anchor="start">◀ REAR FACE</text>
<text x="62" y="116" class="fd" text-anchor="start">3φ AC studs · PE · fans · air EXHAUST</text>
<text x="556" y="98" class="face" text-anchor="end">FRONT FACE ▶</text>
<text x="556" y="116" class="fd" text-anchor="end">DC± studs · CAN · display · buttons · air INLET</text>

<rect x="62" y="196" width="494" height="399" class="board"/><text x="62" y="138" class="btitle">DC-DC BOARD (upper)  ·  semis → upper extrusion</text><text x="62" y="154" class="bsub">520×420 mm · 7 zones · barrier at the transformer row</text><rect x="62" y="196" width="44.46" height="323.19" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><g transform="translate(84.23,357.595) rotate(-90)"><text x="0" y="-7" class="zl">BUS IN</text><text x="0" y="9" class="zd">film commutation</text></g><rect x="106.46000000000001" y="196" width="98.80000000000001" height="323.19" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><g transform="translate(155.86,357.595) rotate(-90)"><text x="0" y="-7" class="zl">LLC LEGS</text><text x="0" y="9" class="zd">3N half-bridges · + drivers</text></g><rect x="205.26000000000002" y="196" width="69.16000000000001" height="323.19" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><g transform="translate(239.84000000000003,357.595) rotate(-90)"><text x="0" y="-7" class="zl">TANKS</text><text x="0" y="9" class="zd">Cr 4×46 nF · + D2 trim</text></g><rect x="274.42" y="196" width="69.16000000000001" height="323.19" fill="#7a3b8a" fill-opacity="0.16" stroke="#7a3b8a" stroke-width="1.4"/><g transform="translate(309,357.595) rotate(-90)"><text x="0" y="-7" class="zl">XFMR ROW</text><text x="0" y="9" class="zd">3N× PQ50/50 · — ON THE BARRIER</text></g><rect x="343.58000000000004" y="196" width="98.80000000000001" height="323.19" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><text x="392.98" y="333.595" class="zl">RECTIFIERS</text><text x="392.98" y="348.595" class="zl">+ BANKS</text><text x="392.98" y="371.595" class="zd">JBS bridges ·</text><text x="392.98" y="383.595" class="zd">bank caps</text><rect x="442.38000000000005" y="196" width="54.34" height="323.19" fill="#a03030" fill-opacity="0.16" stroke="#a03030" stroke-width="1.4"/><g transform="translate(469.55000000000007,357.595) rotate(-90)"><text x="0" y="-7" class="zl">S/P MATRIX</text><text x="0" y="9" class="zd">HV relays · · bleeders</text></g><rect x="496.72" y="196" width="59.28" height="323.19" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(526.36,357.595) rotate(-90)"><text x="0" y="-7" class="zl">OUTPUT</text><text x="0" y="9" class="zd">filter · shunt · · DC± studs</text></g><rect x="62" y="519.19" width="494" height="75.81" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="66" y="185" width="486" height="9" class="track"/><rect x="66" y="185" width="443.161094224924" height="9" class="rail"/><text x="66" y="172" class="rl">device rail — 60× TO-247 @20 mm = 1200 mm vs 1316 mm usable perimeter = 91%</text>
<line x1="343.58000000000004" y1="192" x2="343.58000000000004" y2="599" class="barrier"/><text x="343.58000000000004" y="615" class="bar">reinforced barrier · 8.0 mm clearance / 12.6 mm creepage · slots through all 6 layers</text>
<rect x="90.5" y="699" width="437" height="399" class="board"/><text x="90.5" y="641" class="btitle">AC-DC BOARD (lower)  ·  semis → lower extrusion</text><text x="90.5" y="657" class="bsub">460×420 mm · 5 zones · single-point control ground lives here</text><rect x="90.5" y="699" width="43.7" height="323.19" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(112.35,860.595) rotate(-90)"><text x="0" y="-7" class="zl">AC ENTRY + SURGE</text><text x="0" y="9" class="zd">studs · fuses · MOV Δ · GDT</text></g><rect x="134.2" y="699" width="69.92" height="323.19" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><g transform="translate(169.16,860.595) rotate(-90)"><text x="0" y="-7" class="zl">EMI FILTER</text><text x="0" y="9" class="zd">2× CM (D7) · DM (D6) · X/Y1</text></g><rect x="204.12" y="699" width="34.96" height="323.19" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><g transform="translate(221.6,860.595) rotate(-90)"><text x="0" y="-7" class="zl">PRE- CHARGE</text><text x="0" y="9" class="zd">2× 33 Ω · bypass relay</text></g><rect x="239.08" y="699" width="174.8" height="323.19" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><g transform="translate(326.48,860.595) rotate(-90)"><text x="0" y="-7" class="zl">VIENNA PFC</text><text x="0" y="9" class="zd">N× 3 phase cells: D1 choke + · 5× TO-247 + RC/RCD clamp</text></g><rect x="413.88" y="699" width="113.62" height="323.19" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><g transform="translate(470.69,860.595) rotate(-90)"><text x="0" y="-7" class="zl">DC LINK</text><text x="0" y="9" class="zd">470 µF bank · film · · discharge · B2B studs</text></g><rect x="90.5" y="1022.19" width="437" height="75.81" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="94.5" y="688" width="429" height="9" class="track"/><rect x="94.5" y="688" width="215.89285714285717" height="9" class="rail"/><text x="94.5" y="675" class="rl">device rail — 31× TO-247 @20 mm = 620 mm vs 1232 mm usable perimeter = 50%</text>

<line x1="62" y1="1156" x2="556" y2="1156" stroke="#b8860b" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="62" y="1142" class="flow" fill="#b8860b">power flow  ▶</text>
<line x1="556" y1="1180" x2="62" y2="1180" stroke="#2c5f8a" stroke-width="2.5" marker-end="url(#af)"/>
<text x="556" y="1166" class="flow" fill="#2c5f8a" text-anchor="end">◀  airflow (opposes power: EMI filter at the exhaust preheats nothing)</text>
<text x="62" y="1206" class="cap">Grey strip on each board = control + sensing, one long edge. On the DC-DC board it is primary-referenced and STOPS at the barrier — HMI and isolated CAN move to a front-panel daughter card.</text>
<defs>
  <marker id="ap" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b8860b"/></marker>
  <marker id="af" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#2c5f8a"/></marker>
</defs>
</svg>
