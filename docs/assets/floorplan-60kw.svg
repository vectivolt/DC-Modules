<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 1230" width="728" height="1230" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
  .board{fill:#fbfbf9;stroke:#333;stroke-width:2}
  .btitle{font-size:15px;font-weight:700;fill:#1a1a1a}
  .bsub{font-size:11px;fill:#666}
  .zl{font-size:11.5px;font-weight:700;fill:#1a1a1a;text-anchor:middle}
  .zd{font-size:9.5px;fill:#555;text-anchor:middle}
  .rail{fill:#2f7d5e;opacity:.8}
  .railbad{fill:#a03030;opacity:.85}
  .track{fill:#ddd}
  .limit{stroke:#a03030;stroke-width:2}
  .rlbad{font-size:9px;fill:#a03030;font-weight:700}
  .rl{font-size:9px;fill:#a03030}
  .barrier{stroke:#7a3b8a;stroke-width:4;stroke-dasharray:9 4}
  .bar{font-size:9.5px;fill:#7a3b8a;text-anchor:middle}
  .face{font-size:11px;font-weight:700;fill:#1a1a1a}   /* no text-anchor: set per element */
  .fd{font-size:9.5px;fill:#555}                       /* no text-anchor: set per element */
  .flow{font-size:10.5px;font-weight:600}
  .cap{font-size:10px;fill:#666}
  .oc{font-size:9.5px;font-weight:700;fill:#a03030;text-anchor:end}
  .ic{font-size:9.5px;font-weight:700;fill:#c05621;text-anchor:end}
  .fan{fill:none;stroke:#2c5f8a;stroke-width:2}
  text{dominant-baseline:middle}
</style>
<rect width="728" height="1230" fill="#fff"/>
<text x="62" y="30" style="font-size:17px;font-weight:700">PCB floorplan — zone plan, 60 kW (drawn to board scale)</text>
<text x="62" y="50" class="cap">AC in + DC out on the REAR face, diagonally opposite · power folds at the front · air front→rear · 19-inch 3U</text>

<text x="62" y="98" class="face" text-anchor="start">◀ REAR FACE  ·  all connectors + exhaust</text>
<text x="62" y="116" class="fd" text-anchor="start">AC IN + PE and DC± OUT + CAN at diagonally opposite corners</text>


<rect x="124" y="196" width="494" height="399" class="board"/><text x="124" y="138" class="btitle">DC-DC BOARD (upper)  ·  semis → upper extrusion</text><text x="124" y="154" class="bsub">520×420 mm · 7 zones · barrier at the transformer row</text><rect x="124" y="196" width="59.28" height="323.19" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(153.64,357.595) rotate(-90)"><text x="0" y="-7" class="zl">OUTPUT</text><text x="0" y="9" class="zd">filter · shunt · · DC± studs</text></g><rect x="183.28" y="196" width="54.34" height="323.19" fill="#a03030" fill-opacity="0.16" stroke="#a03030" stroke-width="1.4"/><g transform="translate(210.45,357.595) rotate(-90)"><text x="0" y="-7" class="zl">S/P MATRIX</text><text x="0" y="9" class="zd">HV relays · · bleeders</text></g><rect x="237.62" y="196" width="98.80000000000001" height="323.19" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><text x="287.02" y="333.595" class="zl">RECTIFIERS</text><text x="287.02" y="348.595" class="zl">+ BANKS</text><text x="287.02" y="371.595" class="zd">JBS bridges ·</text><text x="287.02" y="383.595" class="zd">bank caps</text><rect x="336.42" y="196" width="69.16000000000001" height="323.19" fill="#7a3b8a" fill-opacity="0.16" stroke="#7a3b8a" stroke-width="1.4"/><g transform="translate(371,357.595) rotate(-90)"><text x="0" y="-7" class="zl">XFMR ROW</text><text x="0" y="9" class="zd">3N× PQ50/50 · — ON THE BARRIER</text></g><rect x="405.58000000000004" y="196" width="69.16000000000001" height="323.19" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><g transform="translate(440.16,357.595) rotate(-90)"><text x="0" y="-7" class="zl">TANKS</text><text x="0" y="9" class="zd">Cr 4×46 nF · + D2 trim</text></g><rect x="474.74000000000007" y="196" width="98.80000000000001" height="323.19" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><g transform="translate(524.1400000000001,357.595) rotate(-90)"><text x="0" y="-7" class="zl">LLC LEGS</text><text x="0" y="9" class="zd">3N half-bridges · + drivers</text></g><rect x="573.5400000000001" y="196" width="44.46" height="323.19" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><g transform="translate(595.7700000000001,357.595) rotate(-90)"><text x="0" y="-7" class="zl">BUS IN</text><text x="0" y="9" class="zd">film commutation</text></g><rect x="124" y="519.19" width="494" height="75.81" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="128" y="185" width="486" height="9" class="track"/><rect x="128" y="185" width="443.161094224924" height="9" class="rail"/><text x="128" y="172" class="rl">device rail — 60× TO-247 @20 mm = 1200 mm vs 1316 mm usable perimeter = 91%</text><rect x="109" y="396.3778" width="15" height="77.5656" fill="#a03030" fill-opacity="0.85" stroke="#a03030" stroke-width="1.5"/><text x="102" y="422.23299999999995" class="oc">DC± OUT</text><text x="102" y="434.23299999999995" class="oc">+ CAN H/L</text>
<line x1="336.42" y1="192" x2="336.42" y2="599" class="barrier"/><text x="336.42" y="615" class="bar">reinforced barrier · 8.0 mm clearance / 12.6 mm creepage · slots through all 6 layers</text>
<rect x="152.5" y="699" width="437" height="399" class="board"/><text x="152.5" y="641" class="btitle">AC-DC BOARD (lower)  ·  semis → lower extrusion</text><text x="152.5" y="657" class="bsub">460×420 mm · 5 zones · single-point control ground lives here</text><rect x="152.5" y="699" width="43.7" height="323.19" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(174.35,860.595) rotate(-90)"><text x="0" y="-7" class="zl">AC ENTRY + SURGE</text><text x="0" y="9" class="zd">studs · fuses · MOV Δ · GDT</text></g><rect x="196.2" y="699" width="69.92" height="323.19" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><g transform="translate(231.16,860.595) rotate(-90)"><text x="0" y="-7" class="zl">EMI FILTER</text><text x="0" y="9" class="zd">2× CM (D7) · DM (D6) · X/Y1</text></g><rect x="266.12" y="699" width="34.96" height="323.19" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><g transform="translate(283.6,860.595) rotate(-90)"><text x="0" y="-7" class="zl">PRE- CHARGE</text><text x="0" y="9" class="zd">2× 33 Ω · bypass relay</text></g><rect x="301.08" y="699" width="174.8" height="323.19" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><g transform="translate(388.48,860.595) rotate(-90)"><text x="0" y="-7" class="zl">VIENNA PFC</text><text x="0" y="9" class="zd">N× 3 phase cells: D1 choke + · 5× TO-247 + RC/RCD clamp</text></g><rect x="475.88" y="699" width="113.62" height="323.19" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><g transform="translate(532.69,860.595) rotate(-90)"><text x="0" y="-7" class="zl">DC LINK</text><text x="0" y="9" class="zd">470 µF bank · film · · discharge · B2B studs</text></g><rect x="152.5" y="1022.19" width="437" height="75.81" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="156.5" y="688" width="429" height="9" class="track"/><rect x="156.5" y="688" width="215.89285714285717" height="9" class="rail"/><text x="156.5" y="675" class="rl">device rail — 31× TO-247 @20 mm = 620 mm vs 1232 mm usable perimeter = 50%</text><rect x="137.5" y="731.319" width="15" height="77.5656" fill="#c05621" fill-opacity="0.85" stroke="#c05621" stroke-width="1.5"/><text x="130.5" y="757.1742" class="ic">3φ AC IN</text><text x="130.5" y="769.1742" class="ic">+ PE</text>

<g>
  <text x="666" y="98" class="face" text-anchor="end">FRONT FACE ▶  fans · display · switch</text>
  <rect x="516" y="108" width="48" height="24" class="fan" rx="4"/><text x="540" y="120" style="font-size:8px;fill:#2c5f8a;text-anchor:middle">FAN</text><rect x="572" y="108" width="48" height="24" class="fan" rx="4"/><text x="596" y="120" style="font-size:8px;fill:#2c5f8a;text-anchor:middle">FAN</text>
  <rect x="632" y="108" width="34" height="24" fill="#455" fill-opacity="0.2" stroke="#455" rx="4"/>
  <text x="649" y="120" style="font-size:7.5px;fill:#333;text-anchor:middle">HMI</text>
</g>
<line x1="62" y1="1156" x2="666" y2="1156" stroke="#b8860b" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="62" y="1142" class="flow" fill="#b8860b">power flow  ▶</text>
<line x1="666" y1="1180" x2="62" y2="1180" stroke="#2c5f8a" stroke-width="2.5" marker-end="url(#af)"/>
<text x="666" y="1166" class="flow" fill="#2c5f8a" text-anchor="end">◀  airflow (opposes power: EMI filter at the exhaust preheats nothing)</text>
<text x="62" y="1206" class="cap">U-fold: the AC-DC board runs rear→front, the DC-DC board front→rear, so the B2B pillars meet at the front of both and are vertical. Grey strip = control + sensing.</text>
<defs>
  <marker id="ap" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b8860b"/></marker>
  <marker id="af" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#2c5f8a"/></marker>
</defs>
</svg>
