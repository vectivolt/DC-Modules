<rect width="1058.3265306122448" height="1591" fill="#fff"/>
<text x="62" y="30" style="font-size:17px;font-weight:700">PCB floorplan — zone plan, 120 kW (drawn to board scale)</text>
<text x="62" y="50" class="cap">AC in + DC out on the REAR face, diagonally opposite · power folds at the front · air front→rear · 19-inch 3U</text>

<text x="62" y="98" class="face" text-anchor="start">◀ REAR FACE  ·  all connectors + exhaust</text>
<text x="62" y="116" class="fd" text-anchor="start">AC IN + PE and DC± OUT + CAN at diagonally opposite corners</text>


<rect x="124" y="196" width="608" height="589" class="board"/><text x="124" y="138" class="btitle">DC-DC BOARD (upper)  ·  semis → upper extrusion</text><text x="124" y="154" class="bsub">640×620 mm · 7 zones · barrier at the transformer row</text><rect x="124" y="196" width="72.96" height="477.09000000000003" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(160.48,434.545) rotate(-90)"><text x="0" y="-7" class="zl">OUTPUT</text><text x="0" y="9" class="zd">filter · shunt · · DC± studs</text></g><rect x="196.95999999999998" y="196" width="66.88" height="477.09000000000003" fill="#a03030" fill-opacity="0.16" stroke="#a03030" stroke-width="1.4"/><g transform="translate(230.39999999999998,434.545) rotate(-90)"><text x="0" y="-7" class="zl">S/P MATRIX</text><text x="0" y="9" class="zd">HV relays · · bleeders</text></g><rect x="263.84" y="196" width="121.60000000000001" height="477.09000000000003" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><text x="324.64" y="410.545" class="zl">RECTIFIERS</text><text x="324.64" y="425.545" class="zl">+ BANKS</text><text x="324.64" y="448.545" class="zd">JBS bridges ·</text><text x="324.64" y="460.545" class="zd">bank caps</text><rect x="385.44" y="196" width="85.12" height="477.09000000000003" fill="#7a3b8a" fill-opacity="0.16" stroke="#7a3b8a" stroke-width="1.4"/><g transform="translate(428,434.545) rotate(-90)"><text x="0" y="-7" class="zl">XFMR ROW</text><text x="0" y="9" class="zd">3N× PQ50/50 · — ON THE BARRIER</text></g><rect x="470.56" y="196" width="85.12" height="477.09000000000003" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><text x="513.12" y="418.045" class="zl">TANKS</text><text x="513.12" y="441.045" class="zd">Cr 4×46 nF</text><text x="513.12" y="453.045" class="zd">+ D2 trim</text><rect x="555.6800000000001" y="196" width="121.60000000000001" height="477.09000000000003" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><text x="616.48" y="418.045" class="zl">LLC LEGS</text><text x="616.48" y="441.045" class="zd">3N half-bridges</text><text x="616.48" y="453.045" class="zd">+ drivers</text><rect x="677.2800000000001" y="196" width="54.72" height="477.09000000000003" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><g transform="translate(704.6400000000001,434.545) rotate(-90)"><text x="0" y="-7" class="zl">BUS IN</text><text x="0" y="9" class="zd">film commutation</text></g><rect x="124" y="673.09" width="608" height="111.91" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="128" y="185" width="600" height="9" class="track"/><rect x="128" y="185" width="816.3265306122448" height="9" class="railbad"/><line x1="728" y1="181" x2="728" y2="199" class="limit"/><text x="128" y="172" class="rlbad">device rail — 120× TO-247 @20 mm = 2400 mm vs 1764 mm usable perimeter = 136%  ✗ DOES NOT FIT — needs interior rails or fewer devices</text><rect x="109" y="491.79580000000004" width="15" height="114.50160000000001" fill="#a03030" fill-opacity="0.85" stroke="#a03030" stroke-width="1.5"/><text x="102" y="529.963" class="oc">DC± OUT</text><text x="102" y="541.963" class="oc">+ CAN H/L</text>
<line x1="385.44" y1="192" x2="385.44" y2="789" class="barrier"/><text x="385.44" y="805" class="bar">reinforced barrier · 8.0 mm clearance / 12.6 mm creepage · slots through all 6 layers</text>
<rect x="162" y="889" width="532" height="570" class="board"/><text x="162" y="831" class="btitle">AC-DC BOARD (lower)  ·  semis → lower extrusion</text><text x="162" y="847" class="bsub">560×600 mm · 5 zones · single-point control ground lives here</text><rect x="162" y="889" width="53.2" height="461.7" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(188.6,1119.85) rotate(-90)"><text x="0" y="-7" class="zl">AC ENTRY + SURGE</text><text x="0" y="9" class="zd">studs · fuses · MOV Δ · GDT</text></g><rect x="215.2" y="889" width="85.12" height="461.7" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><g transform="translate(257.76,1119.85) rotate(-90)"><text x="0" y="-7" class="zl">EMI FILTER</text><text x="0" y="9" class="zd">2× CM (D7) · DM (D6) · X/Y1</text></g><rect x="300.32" y="889" width="42.56" height="461.7" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><g transform="translate(321.6,1119.85) rotate(-90)"><text x="0" y="-7" class="zl">PRE- CHARGE</text><text x="0" y="9" class="zd">2× 33 Ω · bypass relay</text></g><rect x="342.88" y="889" width="212.8" height="461.7" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><text x="449.28" y="1103.35" class="zl">VIENNA PFC</text><text x="449.28" y="1126.35" class="zd">N× 3 phase cells: D1 choke +</text><text x="449.28" y="1138.35" class="zd">5× TO-247 + RC/RCD clamp</text><rect x="555.6800000000001" y="889" width="138.32" height="461.7" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><text x="624.84" y="1103.35" class="zl">DC LINK</text><text x="624.84" y="1126.35" class="zd">470 µF bank · film ·</text><text x="624.84" y="1138.35" class="zd">discharge · B2B studs</text><rect x="162" y="1350.7" width="532" height="108.3" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="166" y="878" width="524" height="9" class="track"/><rect x="166" y="878" width="393.6453201970443" height="9" class="rail"/><text x="166" y="865" class="rl">device rail — 61× TO-247 @20 mm = 1220 mm vs 1624 mm usable perimeter = 75%</text><rect x="147" y="935.17" width="15" height="110.80799999999999" fill="#c05621" fill-opacity="0.85" stroke="#c05621" stroke-width="1.5"/><text x="140" y="972.106" class="ic">3φ AC IN</text><text x="140" y="984.106" class="ic">+ PE</text>

<g>
  <text x="996.3265306122448" y="98" class="face" text-anchor="end">FRONT FACE ▶  fans · display · switch</text>
  <rect x="846.3265306122448" y="108" width="48" height="24" class="fan" rx="4"/><text x="870.3265306122448" y="120" style="font-size:8px;fill:#2c5f8a;text-anchor:middle">FAN</text><rect x="902.3265306122448" y="108" width="48" height="24" class="fan" rx="4"/><text x="926.3265306122448" y="120" style="font-size:8px;fill:#2c5f8a;text-anchor:middle">FAN</text>
  <rect x="962.3265306122448" y="108" width="34" height="24" fill="#455" fill-opacity="0.2" stroke="#455" rx="4"/>
  <text x="979.3265306122448" y="120" style="font-size:7.5px;fill:#333;text-anchor:middle">HMI</text>
</g>
<line x1="62" y1="1517" x2="996.3265306122448" y2="1517" stroke="#b8860b" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="62" y="1503" class="flow" fill="#b8860b">power flow  ▶</text>
<line x1="996.3265306122448" y1="1541" x2="62" y2="1541" stroke="#2c5f8a" stroke-width="2.5" marker-end="url(#af)"/>
<text x="996.3265306122448" y="1527" class="flow" fill="#2c5f8a" text-anchor="end">◀  airflow (opposes power: EMI filter at the exhaust preheats nothing)</text>
<text x="62" y="1567" class="cap">U-fold: the AC-DC board runs rear→front, the DC-DC board front→rear, so the B2B pillars meet at the front of both and are vertical. Grey strip = control + sensing.</text>
