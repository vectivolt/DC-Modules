<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1058.3265306122448 1591" width="1058.3265306122448" height="1591" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
