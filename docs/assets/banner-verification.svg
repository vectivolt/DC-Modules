<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="DC-Modules documentation · Verification and simulation">
<style>
  .lbl{font:600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;letter-spacing:2.4px;fill:#8B949E}
  .fam{font:600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.2px}
  .grat{stroke:#8B949E;stroke-opacity:.22;stroke-width:1;stroke-dasharray:1 5}
  .axis{stroke:#8B949E;stroke-opacity:.35;stroke-width:1}
  .tr{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .scroll{animation:scroll var(--dur,12s) linear infinite}
  @keyframes scroll{to{transform:translateX(var(--shift))}}
  .sweep{animation:sweep 9s linear infinite}
  @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(880px)}}
  .flow{animation:flow 2.8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-80}}
  .comet{animation:comet 7s linear infinite}
  .pulse{animation:pulse 3.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  
  @media (prefers-reduced-motion: reduce){.scroll,.sweep,.flow,.comet,.pulse{animation:none}}
</style>
<defs><clipPath id="win"><rect x="300" y="6" width="894" height="108" rx="6"/></clipPath></defs>
<text class="lbl" x="28" y="48">DC-MODULES · DOCS</text>
<text class="fam" x="28" y="76" fill="#3F7FC4">Verification &amp; simulation</text>
<line x1="28" y1="90" x2="50" y2="90" stroke="#3F7FC4" stroke-width="3" stroke-linecap="round"/>
<g clip-path="url(#win)"><line class="grat" x1="300" y1="10" x2="300" y2="110"/><line class="grat" x1="388" y1="10" x2="388" y2="110"/><line class="grat" x1="476" y1="10" x2="476" y2="110"/><line class="grat" x1="564" y1="10" x2="564" y2="110"/><line class="grat" x1="652" y1="10" x2="652" y2="110"/><line class="grat" x1="740" y1="10" x2="740" y2="110"/><line class="grat" x1="828" y1="10" x2="828" y2="110"/><line class="grat" x1="916" y1="10" x2="916" y2="110"/><line class="grat" x1="1004" y1="10" x2="1004" y2="110"/><line class="grat" x1="1092" y1="10" x2="1092" y2="110"/><line class="grat" x1="1180" y1="10" x2="1180" y2="110"/><line class="grat" x1="300" y1="30" x2="1192" y2="30"/><line class="grat" x1="300" y1="60" x2="1192" y2="60"/><line class="grat" x1="300" y1="90" x2="1192" y2="90"/><line class="axis" x1="300" y1="60" x2="1192" y2="60"/><path class="tr" stroke="#3F7FC4" stroke-opacity=".85" d="M300,90L300,30L337,30L337,90L432,90L432,30L492.7,30L492.7,90L564,90L564,30L647.2,30L647.2,90L696,90L696,30L762,30L762,90L828,90L828,30L875.5,30L875.5,90L960,90L960,30L1032.6,30L1032.6,90L1092,90L1092,30L1184.4,30L1184.4,90L1224,90"/><circle cx="318.5" cy="30" r="2.6" fill="#3F7FC4"/><circle cx="462.4" cy="30" r="2.6" fill="#3F7FC4"/><circle cx="605.6" cy="30" r="2.6" fill="#3F7FC4"/><circle cx="729" cy="30" r="2.6" fill="#3F7FC4"/><circle cx="851.8" cy="30" r="2.6" fill="#3F7FC4"/><circle cx="996.3" cy="30" r="2.6" fill="#3F7FC4"/><circle cx="1138.2" cy="30" r="2.6" fill="#3F7FC4"/>
<g class="sweep"><line x1="310" y1="8" x2="310" y2="112" stroke="#D19A00" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="306" y="54" width="8" height="12" rx="2" fill="#D19A00"/></g></g>
</svg>
