<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="235" viewBox="0 0 1000 235" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161c"/><stop offset="1" stop-color="#1d2130"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b705"/><stop offset="1" stop-color="#e3763c"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="235" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="233" rx="13" fill="none" stroke="#3a3f52" stroke-width="1.5"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#f3f0e8">DC-Modules · 30/60/120 kW EV Fast-Charging</text>
  <text x="40" y="80" font-size="13.5" fill="#9aa3b5">All-SiC Vienna + 3-φ LLC · 150–1000 VDC S/P output · two-board sandwich · one ~10 kW cell</text>

  <!-- status pulse, top right -->
  <g transform="translate(952,44)">
    <circle r="6" fill="#6fae7d"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="-14" y="4" text-anchor="end" font-size="12" fill="#9aa3b5">E1–E24 frozen</text>
  </g>

  <!-- power flow rail: boxes 120 wide on a 150 px grid, centers 190/340/490/640/790 -->
  <g transform="translate(0,128)">
    <path d="M40,40 H130 M250,40 H280 M400,40 H430 M550,40 H580 M700,40 H730 M850,40 H904"
          stroke="url(#amber)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="13 11">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <text x="40" y="24" font-size="13" fill="#c9d0dd">3φ AC</text>
    <text x="912" y="45" font-size="13" fill="#6fae7d" font-weight="700">EV ▸</text>

    <g text-anchor="middle">
      <g>
        <rect x="130" y="12" width="120" height="56" rx="9" fill="#232838" stroke="#f2b705" stroke-width="1.6"/>
        <text x="190" y="36" font-size="13" font-weight="600" fill="#f3f0e8">EMI + surge</text>
        <text x="190" y="55" font-size="10.5" fill="#8f97a8">2× CM · DM · MOV</text>
      </g>
      <g>
        <rect x="280" y="12" width="120" height="56" rx="9" fill="#232838" stroke="#f2b705" stroke-width="1.6">
          <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.2s" repeatCount="indefinite"/>
        </rect>
        <text x="340" y="36" font-size="13" font-weight="600" fill="#f3f0e8">Vienna PFC</text>
        <text x="340" y="55" font-size="10.5" fill="#8f97a8">50 kHz · SiC</text>
      </g>
      <g>
        <rect x="430" y="12" width="120" height="56" rx="9" fill="#232838" stroke="#5f8fc0" stroke-width="1.6"/>
        <text x="490" y="36" font-size="13" font-weight="600" fill="#f3f0e8">DC bus</text>
        <text x="490" y="55" font-size="10.5" fill="#8f97a8">650–830 V</text>
      </g>
      <g>
        <rect x="580" y="12" width="120" height="56" rx="9" fill="#232838" stroke="#f2b705" stroke-width="1.6">
          <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
        </rect>
        <text x="640" y="36" font-size="13" font-weight="600" fill="#f3f0e8">3-φ LLC</text>
        <text x="640" y="55" font-size="10.5" fill="#8f97a8">140 kHz · ZVS</text>
      </g>
      <g>
        <rect x="730" y="12" width="120" height="56" rx="9" fill="#232838" stroke="#6fae7d" stroke-width="1.6"/>
        <text x="790" y="36" font-size="13" font-weight="600" fill="#f3f0e8">S/P banks</text>
        <text x="790" y="55" font-size="10.5" fill="#8f97a8">150–1000 V</text>
      </g>
    </g>
  </g>
</svg>
