<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 671 1021" width="671" height="1021" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
  .board{fill:#fbfbf9;stroke:#333;stroke-width:2}
  .btitle{font-size:15px;font-weight:700;fill:#1a1a1a}
  .bsub{font-size:11px;fill:#666}
  .zl{font-size:11.5px;font-weight:700;fill:#1a1a1a;text-anchor:middle}
  .zd{font-size:9.5px;fill:#555;text-anchor:middle}
  .rail{fill:#2f7d5e;opacity:.8}
  .railbad{fill:#a03030;opacity:.85}
  .track{fill:#ddd}
  .limit{stroke:#a03030;stroke-width:2}
  .rlbad{font-size:9px;fill:#a03030;font-weight:700}
  .rl{font-size:9px;fill:#a03030}
  .barrier{stroke:#7a3b8a;stroke-width:4;stroke-dasharray:9 4}
  .bar{font-size:9.5px;fill:#7a3b8a;text-anchor:middle}
  .face{font-size:11px;font-weight:700;fill:#1a1a1a}   /* no text-anchor: set per element */
  .fd{font-size:9.5px;fill:#555}                       /* no text-anchor: set per element */
  .flow{font-size:10.5px;font-weight:600}
  .cap{font-size:10px;fill:#666}
  .oc{font-size:9.5px;font-weight:700;fill:#a03030;text-anchor:start}
  text{dominant-baseline:middle}
</style>
<rect width="671" height="1021" fill="#fff"/>
<text x="62" y="30" style="font-size:17px;font-weight:700">PCB floorplan — zone plan, 30 kW (drawn to board scale)</text>
<text x="62" y="50" class="cap">AC in and DC out DIAGONALLY OPPOSITE · power rear→front · air front→rear · 19-inch 3U card</text>

<text x="62" y="98" class="face" text-anchor="start">◀ REAR FACE</text>
<text x="62" y="116" class="fd" text-anchor="start">AC IN + PE (left quarter) · fans + EXHAUST</text>
<text x="609" y="98" class="face" text-anchor="end">FRONT FACE ▶</text>
<text x="609" y="116" class="fd" text-anchor="end">air INLET · display · DC± OUT + CAN (right quarter)</text>

<rect x="124" y="196" width="437" height="304" class="board"/><text x="124" y="138" class="btitle">DC-DC BOARD (upper)  ·  semis → upper extrusion</text><text x="124" y="154" class="bsub">460×320 mm · 7 zones · barrier at the transformer row</text><rect x="124" y="196" width="39.33" height="246.24" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><g transform="translate(143.665,319.12) rotate(-90)"><text x="0" y="-7" class="zl">BUS IN</text><text x="0" y="9" class="zd">film commutation</text></g><rect x="163.32999999999998" y="196" width="87.4" height="246.24" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><g transform="translate(207.02999999999997,319.12) rotate(-90)"><text x="0" y="-7" class="zl">LLC LEGS</text><text x="0" y="9" class="zd">3N half-bridges · + drivers</text></g><rect x="250.73" y="196" width="61.18000000000001" height="246.24" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><g transform="translate(281.32,319.12) rotate(-90)"><text x="0" y="-7" class="zl">TANKS</text><text x="0" y="9" class="zd">Cr 4×46 nF · + D2 trim</text></g><rect x="311.90999999999997" y="196" width="61.18000000000001" height="246.24" fill="#7a3b8a" fill-opacity="0.16" stroke="#7a3b8a" stroke-width="1.4"/><g transform="translate(342.5,319.12) rotate(-90)"><text x="0" y="-7" class="zl">XFMR ROW</text><text x="0" y="9" class="zd">3N× PQ50/50 · — ON THE BARRIER</text></g><rect x="373.09" y="196" width="87.4" height="246.24" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><g transform="translate(416.78999999999996,319.12) rotate(-90)"><text x="0" y="-7" class="zl">RECTIFIERS + BANKS</text><text x="0" y="9" class="zd">JBS bridges · · bank caps</text></g><rect x="460.49" y="196" width="48.07" height="246.24" fill="#a03030" fill-opacity="0.16" stroke="#a03030" stroke-width="1.4"/><g transform="translate(484.52500000000003,319.12) rotate(-90)"><text x="0" y="-7" class="zl">S/P MATRIX</text><text x="0" y="9" class="zd">HV relays · · bleeders</text></g><rect x="508.56" y="196" width="52.44" height="246.24" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(534.78,319.12) rotate(-90)"><text x="0" y="-7" class="zl">OUTPUT</text><text x="0" y="9" class="zd">filter · shunt · · DC± studs</text></g><rect x="124" y="442.24" width="437" height="57.76" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="128" y="185" width="429" height="9" class="track"/><rect x="128" y="185" width="235.71428571428572" height="9" class="rail"/><text x="128" y="172" class="rl">device rail — 30× TO-247 @20 mm = 600 mm vs 1092 mm usable perimeter = 55%</text><rect x="561" y="353.59360000000004" width="14" height="64.0224" fill="#a03030" fill-opacity="0.85" stroke="#a03030" stroke-width="1.5"/><text x="568" y="385.60480000000007" style="font-size:9px;font-weight:700;fill:#fff;text-anchor:middle"></text><text x="581" y="373.2928" class="oc">DC± OUT</text><text x="581" y="385.2928" class="oc">+ CAN H/L</text>
<line x1="373.09" y1="192" x2="373.09" y2="504" class="barrier"/><text x="373.09" y="520" class="bar">reinforced barrier · 8.0 mm clearance / 12.6 mm creepage · slots through all 6 layers</text>
<rect x="143" y="604" width="399" height="285" class="board"/><text x="143" y="546" class="btitle">AC-DC BOARD (lower)  ·  semis → lower extrusion</text><text x="143" y="562" class="bsub">420×300 mm · 5 zones · single-point control ground lives here</text><rect x="143" y="604" width="39.900000000000006" height="230.85" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(162.95,719.425) rotate(-90)"><text x="0" y="-7" class="zl">AC ENTRY + SURGE</text><text x="0" y="9" class="zd">studs · fuses · MOV Δ · GDT</text></g><rect x="182.9" y="604" width="63.84" height="230.85" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><g transform="translate(214.82,719.425) rotate(-90)"><text x="0" y="-7" class="zl">EMI FILTER</text><text x="0" y="9" class="zd">2× CM (D7) · DM (D6) · X/Y1</text></g><rect x="246.74" y="604" width="31.92" height="230.85" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><g transform="translate(262.7,719.425) rotate(-90)"><text x="0" y="-7" class="zl">PRE- CHARGE</text><text x="0" y="9" class="zd">2× 33 Ω · bypass relay</text></g><rect x="278.66" y="604" width="159.60000000000002" height="230.85" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><g transform="translate(358.46000000000004,719.425) rotate(-90)"><text x="0" y="-7" class="zl">VIENNA PFC</text><text x="0" y="9" class="zd">N× 3 phase cells: D1 choke + · 5× TO-247 + RC/RCD clamp</text></g><rect x="438.26000000000005" y="604" width="103.74000000000001" height="230.85" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><g transform="translate(490.13000000000005,719.425) rotate(-90)"><text x="0" y="-7" class="zl">DC LINK</text><text x="0" y="9" class="zd">470 µF bank · film · · discharge · B2B studs</text></g><rect x="143" y="834.85" width="399" height="54.15" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="147" y="593" width="391" height="9" class="track"/><rect x="147" y="593" width="124.12698412698413" height="9" class="rail"/><text x="147" y="580" class="rl">device rail — 16× TO-247 @20 mm = 320 mm vs 1008 mm usable perimeter = 32%</text><rect x="129" y="627.085" width="14" height="60.021" fill="#c05621" fill-opacity="0.85" stroke="#c05621" stroke-width="1.5"/><text x="136" y="657.0955" style="font-size:9px;font-weight:700;fill:#fff;text-anchor:middle"></text><text x="123" y="657.0955" style="font-size:9.5px;font-weight:700;fill:#c05621;text-anchor:end">3φ AC IN</text>

<line x1="62" y1="947" x2="609" y2="947" stroke="#b8860b" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="62" y="933" class="flow" fill="#b8860b">power flow  ▶</text>
<line x1="609" y1="971" x2="62" y2="971" stroke="#2c5f8a" stroke-width="2.5" marker-end="url(#af)"/>
<text x="609" y="957" class="flow" fill="#2c5f8a" text-anchor="end">◀  airflow (opposes power: EMI filter at the exhaust preheats nothing)</text>
<text x="62" y="997" class="cap">Grey strip on each board = control + sensing, one long edge. On the DC-DC board it is primary-referenced and STOPS at the barrier — HMI and isolated CAN move to a front-panel daughter card.</text>
<defs>
  <marker id="ap" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b8860b"/></marker>
  <marker id="af" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#2c5f8a"/></marker>
</defs>
</svg>
