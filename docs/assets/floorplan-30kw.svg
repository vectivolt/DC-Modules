<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 561 1021" width="561" height="1021" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
  .board{fill:#fbfbf9;stroke:#333;stroke-width:2}
  .btitle{font-size:15px;font-weight:700;fill:#1a1a1a}
  .bsub{font-size:11px;fill:#666}
  .zl{font-size:11.5px;font-weight:700;fill:#1a1a1a;text-anchor:middle}
  .zd{font-size:9.5px;fill:#555;text-anchor:middle}
  .rail{fill:#2f7d5e;opacity:.8}
  .railbad{fill:#a03030;opacity:.85}
  .track{fill:#ddd}
  .limit{stroke:#a03030;stroke-width:2}
  .rlbad{font-size:9px;fill:#a03030;font-weight:700}
  .rl{font-size:9px;fill:#a03030}
  .barrier{stroke:#7a3b8a;stroke-width:4;stroke-dasharray:9 4}
  .bar{font-size:9.5px;fill:#7a3b8a;text-anchor:middle}
  .face{font-size:11px;font-weight:700;fill:#1a1a1a}   /* no text-anchor: set per element */
  .fd{font-size:9.5px;fill:#555}                       /* no text-anchor: set per element */
  .flow{font-size:10.5px;font-weight:600}
  .cap{font-size:10px;fill:#666}
  text{dominant-baseline:middle}
</style>
<rect width="561" height="1021" fill="#fff"/>
<text x="62" y="30" style="font-size:17px;font-weight:700">PCB floorplan — zone plan, 30 kW (drawn to board scale)</text>
<text x="62" y="50" class="cap">Power flows rear → front on both boards. Air flows front → rear. Zones from docs/pcb-floorplan.md §3–§4.</text>

<text x="62" y="98" class="face" text-anchor="start">◀ REAR FACE</text>
<text x="62" y="116" class="fd" text-anchor="start">3φ AC studs · PE · fans · air EXHAUST</text>
<text x="499" y="98" class="face" text-anchor="end">FRONT FACE ▶</text>
<text x="499" y="116" class="fd" text-anchor="end">DC± studs · CAN · display · buttons · air INLET</text>

<rect x="62" y="196" width="437" height="304" class="board"/><text x="62" y="138" class="btitle">DC-DC BOARD (upper)  ·  semis → upper extrusion</text><text x="62" y="154" class="bsub">460×320 mm · 7 zones · barrier at the transformer row</text><rect x="62" y="196" width="39.33" height="246.24" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><g transform="translate(81.66499999999999,319.12) rotate(-90)"><text x="0" y="-7" class="zl">BUS IN</text><text x="0" y="9" class="zd">film commutation</text></g><rect x="101.33" y="196" width="87.4" height="246.24" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><g transform="translate(145.03,319.12) rotate(-90)"><text x="0" y="-7" class="zl">LLC LEGS</text><text x="0" y="9" class="zd">3N half-bridges · + drivers</text></g><rect x="188.73000000000002" y="196" width="61.18000000000001" height="246.24" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><g transform="translate(219.32000000000002,319.12) rotate(-90)"><text x="0" y="-7" class="zl">TANKS</text><text x="0" y="9" class="zd">Cr 4×46 nF · + D2 trim</text></g><rect x="249.91000000000003" y="196" width="61.18000000000001" height="246.24" fill="#7a3b8a" fill-opacity="0.16" stroke="#7a3b8a" stroke-width="1.4"/><g transform="translate(280.5,319.12) rotate(-90)"><text x="0" y="-7" class="zl">XFMR ROW</text><text x="0" y="9" class="zd">3N× PQ50/50 · — ON THE BARRIER</text></g><rect x="311.09000000000003" y="196" width="87.4" height="246.24" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><g transform="translate(354.79,319.12) rotate(-90)"><text x="0" y="-7" class="zl">RECTIFIERS + BANKS</text><text x="0" y="9" class="zd">JBS bridges · · bank caps</text></g><rect x="398.49" y="196" width="48.07" height="246.24" fill="#a03030" fill-opacity="0.16" stroke="#a03030" stroke-width="1.4"/><g transform="translate(422.52500000000003,319.12) rotate(-90)"><text x="0" y="-7" class="zl">S/P MATRIX</text><text x="0" y="9" class="zd">HV relays · · bleeders</text></g><rect x="446.56" y="196" width="52.44" height="246.24" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(472.78,319.12) rotate(-90)"><text x="0" y="-7" class="zl">OUTPUT</text><text x="0" y="9" class="zd">filter · shunt · · DC± studs</text></g><rect x="62" y="442.24" width="437" height="57.76" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="66" y="185" width="429" height="9" class="track"/><rect x="66" y="185" width="235.71428571428572" height="9" class="rail"/><text x="66" y="172" class="rl">device rail — 30× TO-247 @20 mm = 600 mm vs 1092 mm usable perimeter = 55%</text>
<line x1="311.09000000000003" y1="192" x2="311.09000000000003" y2="504" class="barrier"/><text x="311.09000000000003" y="520" class="bar">reinforced barrier · 8.0 mm clearance / 12.6 mm creepage · slots through all 6 layers</text>
<rect x="81" y="604" width="399" height="285" class="board"/><text x="81" y="546" class="btitle">AC-DC BOARD (lower)  ·  semis → lower extrusion</text><text x="81" y="562" class="bsub">420×300 mm · 5 zones · single-point control ground lives here</text><rect x="81" y="604" width="39.900000000000006" height="230.85" fill="#c05621" fill-opacity="0.16" stroke="#c05621" stroke-width="1.4"/><g transform="translate(100.95,719.425) rotate(-90)"><text x="0" y="-7" class="zl">AC ENTRY + SURGE</text><text x="0" y="9" class="zd">studs · fuses · MOV Δ · GDT</text></g><rect x="120.9" y="604" width="63.84" height="230.85" fill="#2f7d5e" fill-opacity="0.16" stroke="#2f7d5e" stroke-width="1.4"/><g transform="translate(152.82,719.425) rotate(-90)"><text x="0" y="-7" class="zl">EMI FILTER</text><text x="0" y="9" class="zd">2× CM (D7) · DM (D6) · X/Y1</text></g><rect x="184.74" y="604" width="31.92" height="230.85" fill="#8a6d1f" fill-opacity="0.16" stroke="#8a6d1f" stroke-width="1.4"/><g transform="translate(200.70000000000002,719.425) rotate(-90)"><text x="0" y="-7" class="zl">PRE- CHARGE</text><text x="0" y="9" class="zd">2× 33 Ω · bypass relay</text></g><rect x="216.66000000000003" y="604" width="159.60000000000002" height="230.85" fill="#b8860b" fill-opacity="0.16" stroke="#b8860b" stroke-width="1.4"/><g transform="translate(296.46000000000004,719.425) rotate(-90)"><text x="0" y="-7" class="zl">VIENNA PFC</text><text x="0" y="9" class="zd">N× 3 phase cells: D1 choke + · 5× TO-247 + RC/RCD clamp</text></g><rect x="376.26000000000005" y="604" width="103.74000000000001" height="230.85" fill="#2c5f8a" fill-opacity="0.16" stroke="#2c5f8a" stroke-width="1.4"/><g transform="translate(428.13000000000005,719.425) rotate(-90)"><text x="0" y="-7" class="zl">DC LINK</text><text x="0" y="9" class="zd">470 µF bank · film · · discharge · B2B studs</text></g><rect x="81" y="834.85" width="399" height="54.15" fill="#455" fill-opacity="0.13" stroke="#455" stroke-width="1.4"/><rect x="85" y="593" width="391" height="9" class="track"/><rect x="85" y="593" width="124.12698412698413" height="9" class="rail"/><text x="85" y="580" class="rl">device rail — 16× TO-247 @20 mm = 320 mm vs 1008 mm usable perimeter = 32%</text>

<line x1="62" y1="947" x2="499" y2="947" stroke="#b8860b" stroke-width="2.5" marker-end="url(#ap)"/>
<text x="62" y="933" class="flow" fill="#b8860b">power flow  ▶</text>
<line x1="499" y1="971" x2="62" y2="971" stroke="#2c5f8a" stroke-width="2.5" marker-end="url(#af)"/>
<text x="499" y="957" class="flow" fill="#2c5f8a" text-anchor="end">◀  airflow (opposes power: EMI filter at the exhaust preheats nothing)</text>
<text x="62" y="997" class="cap">Grey strip on each board = control + sensing, one long edge. On the DC-DC board it is primary-referenced and STOPS at the barrier — HMI and isolated CAN move to a front-panel daughter card.</text>
<defs>
  <marker id="ap" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b8860b"/></marker>
  <marker id="af" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#2c5f8a"/></marker>
</defs>
</svg>
